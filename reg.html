<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANOMALY</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Cinzel',serif;
background:black;
color:white;
overflow:hidden;
}

/* ---------------- LOADER ---------------- */

#loader{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
text-align:center;
}

#loader h1{
font-size:8vw;
letter-spacing:15px;
animation:flicker 3s infinite;
}

#loader p{
opacity:.6;
letter-spacing:3px;
margin-top:10px;
}

.enter{
margin-top:40px;
padding:15px 40px;
border:1px solid white;
background:transparent;
color:white;
cursor:pointer;
letter-spacing:3px;
transition:.3s;
}

.enter:hover{
background:white;
color:black;
}

/* flicker */
@keyframes flicker{
0%,100%{opacity:1}
50%{opacity:.3}
55%{opacity:.8}
60%{opacity:.2}
}

/* ---------------- BACKGROUND ---------------- */

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 30%,rgba(255,255,255,.05),transparent 40%),
radial-gradient(circle at 80% 70%,rgba(255,255,255,.03),transparent 40%),
black;
animation:move 12s infinite alternate;
z-index:0;
}

@keyframes move{
0%{transform:scale(1)}
100%{transform:scale(1.1)}
}

/* fog */
.fog{
position:fixed;
inset:0;
background:radial-gradient(circle,transparent,rgba(255,255,255,.02));
animation:fog 18s linear infinite;
pointer-events:none;
z-index:1;
}

@keyframes fog{
0%{transform:translateX(-5%)}
100%{transform:translateX(5%)}
}

/* ---------------- FORM ---------------- */

.container{
position:relative;
z-index:2;
height:100vh;
display:none;
justify-content:center;
align-items:center;
}

.card{
width:380px;
padding:25px;
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.15);
backdrop-filter:blur(10px);
}

.title{
font-size:22px;
letter-spacing:5px;
margin-bottom:20px;
animation:glitch 6s infinite;
}

@keyframes glitch{
0%,90%{transform:translate(0)}
92%{transform:translate(2px)}
94%{transform:translate(-2px)}
96%{transform:translate(1px)}
}

input{
width:100%;
padding:12px;
margin:7px 0;
background:transparent;
border:1px solid rgba(255,255,255,.2);
color:white;
outline:none;
font-family:'Cinzel',serif;
}

input:focus{
border-color:white;
}

button{
width:100%;
padding:14px;
margin-top:10px;
background:transparent;
border:1px solid white;
color:white;
cursor:pointer;
letter-spacing:3px;
transition:.3s;
}

button:hover{
background:white;
color:black;
}

/* subtle shake */
.shake{
animation:shake .2s;
}

@keyframes shake{
0%{transform:translate(2px)}
50%{transform:translate(-2px)}
100%{transform:translate(0)}
}

</style>
</head>

<body>

<!-- AUDIO -->
<audio id="sound" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_d7c2c5c6f6.mp3?filename=dark-ambient-horror-ambient-110241.mp3" type="audio/mpeg">
</audio>

<!-- LOADER -->
<div id="loader">
<h1>ANOMALY</h1>
<p>YOU ARE BEING WATCHED</p>
<button class="enter" onclick="enter()">ENTER</button>
</div>

<!-- BACKGROUND -->
<div class="bg"></div>
<div class="fog"></div>

<!-- FORM -->
<div class="container" id="main">

<div class="card">

<div class="title">ENTRY NODE</div>

<form id="form">

<input type="text" id="muid" placeholder="MuLearn MUID" required>
<input type="text" id="name" placeholder="Full Name" required>
<input type="email" id="email" placeholder="Email" required>
<input type="text" id="phone" placeholder="Phone" required>
<input type="number" id="karma" placeholder="Karma Points" required>
<input type="text" id="rank" placeholder="Rank" required>

<button type="submit">INITIATE</button>

</form>

</div>

</div>

<script>

const audio = document.getElementById("sound");

/* ENTER SEQUENCE */
function enter() {
  document.getElementById("loader").style.opacity = "0";

  setTimeout(() => {
    document.getElementById("loader").style.display = "none";
    document.getElementById("main").style.display = "flex";

    audio.volume = 0.25;
    audio.play().catch(() => {});
  }, 900);
}

/* submit */
document.getElementById("form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const data = {
    muid: document.getElementById("muid").value,
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    karma: document.getElementById("karma").value,
    rank: document.getElementById("rank").value
  };

  try {
    await fetch("https://script.google.com/macros/s/AKfycbwDUYtUS1nBoY5nBt7sih5XFQ6RXA9z6ZKiaJAYCRVWHsWtBGpDoy-bP7gw5w_9V0M/exec", {
      method: "POST",
      body: JSON.stringify(data)
    });

    /* 🎬 cinematic acceptance moment */
    document.body.innerHTML = `
      <div style="
        height:100vh;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        background:black;
        color:white;
        font-family:Cinzel,serif;
        letter-spacing:3px;
        text-align:center;
      ">
        <h1 style="font-size:3vw; animation:flicker 2s infinite;">
          ENTRY ACCEPTED
        </h1>
        <p style="opacity:0.6; margin-top:15px;">
          Redirecting to anomaly channel...
        </p>
      </div>
    `;

    setTimeout(() => {
      window.location.href = "https://chat.whatsapp.com/CHCOipdHbX06Mj3SV7IDPc?s=sh&p=a&mlu=3";
    }, 2500);

  } catch (err) {
    alert("Connection error. Try again.");
    console.log(err);
  }
});

/* subtle glitch shake */
setInterval(() => {
  document.body.classList.add("shake");
  setTimeout(() => document.body.classList.remove("shake"), 150);
}, 9000);

</script>
</body>
</html>
